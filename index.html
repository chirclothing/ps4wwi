<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Controller Evolution | WebAR (AR.js)</title>
    <title>Controller Evolution</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css" />

<!-- A-Frame and AR.js -->
<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.3.3/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden; background-color: transparent;">

<!-- UI Overlay Layer -->
<div id="ui-layer">
<!-- Info Panel for Phases 0-10 -->
<div id="info-panel" class="panel-content">
<h1 id="phase-title" class="panel-title">Controller Name</h1>
<div id="phase-released" class="panel-released">Released: 19XX</div>
<p id="phase-history" class="panel-desc">History goes here...</p>
</div>

<!-- GameBoy Panel for Phase 11 -->
<div id="gameboy-panel" class="panel-gameboy" style="display: none;">
<div class="gameboy-body">
<div class="gameboy-screen-bezel">
<div class="screen-header">
<span class="power-light"></span>
<span>BATTERY</span>
</div>
<canvas id="game-canvas" width="160" height="144"></canvas>
</div>

<div class="gameboy-controls">
<div class="dpad">
<!-- Invisible click targets first so sibling selectors work -->
<div class="dpad-button up" id="btn-up"></div>
<div class="dpad-button down" id="btn-down"></div>
<div class="dpad-button left" id="btn-left"></div>
<div class="dpad-button right" id="btn-right"></div>
<!-- Visual parts -->
<div class="dpad-vertical"></div>
<div class="dpad-horizontal"></div>
<div class="dpad-center"></div>
</div>
<div class="action-buttons">
<div class="action-button-group">
<button class="action-btn b" id="btn-b"></button>
<span class="label">B</span>
</div>
<div class="action-button-group">
<button class="action-btn a" id="btn-a"></button>
<span class="label">A</span>
</div>
</div>
</div>
<div class="system-buttons">
<div class="sys-btn-group">
<div class="sys-btn select" id="btn-select"></div>
<span class="label">SELECT</span>
</div>
<div class="sys-btn-group">
<div class="sys-btn start" id="btn-start"></div>
<span class="label">START</span>
</div>
</div>
<div class="speaker-grill">
<div></div><div></div><div></div><div></div><div></div><div></div>
</div>
</div>
</div>

<!-- Bottom UI -->
<div id="bottom-ui" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
<!-- Features Panel -->
<div id="features-panel" class="features-section">
<h3>Unique Features</h3>
<ul id="phase-features" class="features-list">
<!-- Populated via JS -->
</ul>
</div>

<!-- Navigation UI -->
<nav class="carousel-nav">
<button id="nav-prev" class="nav-button" aria-label="Previous Panel">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
</button>
<div class="nav-indicators" id="nav-indicators">
<!-- Populated via JS -->
</div>
<button id="nav-next" class="nav-button" aria-label="Next Panel">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
</button>
</nav>
</div>
</div>

<!-- WebAR Scene Layer -->
<a-scene 
embedded 
arjs="sourceType: webcam; debugUIEnabled: false;" 
renderer="logarithmicDepthBuffer: true; colorManagement: true;" 
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false"
loading-screen="enabled: false">

<a-assets timeout="10000">
<a-asset-item id="model0" src="models/atari-2600.glb" crossorigin="anonymous"></a-asset-item>
<a-asset-item id="model1" src="models/nes-controller.glb" crossorigin="anonymous"></a-asset-item>
<a-asset-item id="model2" src="models/snes-controller.glb" crossorigin="anonymous"></a-asset-item>
<a-asset-item id="model3" src="models/ps1-controller.glb" crossorigin="anonymous"></a-asset-item>
<a-asset-item id="model4" src="models/n64-controller.glb" crossorigin="anonymous"></a-asset-item>
<!-- Missing models 5-9 removed to prevent 404 loading timeouts -->
<a-asset-item id="model10" src="models/ps4-dualshock.glb" crossorigin="anonymous"></a-asset-item>
</a-assets>

<a-marker type="pattern" url="patt.hiro">
<!-- Lights -->
<a-light type="ambient" color="#FFF" intensity="0.5"></a-light>
<a-light type="directional" color="#FFF" intensity="0.8" position="0 1 1"></a-light>

<!-- Models hovering slightly above the marker -->
<a-gltf-model id="ar-model-0" src="#model0" position="0 0.1 0" scale="0.5 0.5 0.5" visible="true" 
animation="property: position; from: 0 0.1 0; to: 0 0.2 0; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true;">
</a-gltf-model>
<a-gltf-model id="ar-model-1" src="#model1" position="0 0.1 0" scale="0.5 0.5 0.5" visible="false" 
animation="property: position; from: 0 0.1 0; to: 0 0.2 0; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true;">
</a-gltf-model>
<a-gltf-model id="ar-model-2" src="#model2" position="0 0.1 0" scale="0.5 0.5 0.5" visible="false" 
animation="property: position; from: 0 0.1 0; to: 0 0.2 0; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true;">
</a-gltf-model>
<a-gltf-model id="ar-model-3" src="#model3" position="0 0.1 0" scale="0.5 0.5 0.5" visible="false" 
animation="property: position; from: 0 0.1 0; to: 0 0.2 0; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true;">
</a-gltf-model>
<a-gltf-model id="ar-model-4" src="#model4" position="0 0.1 0" scale="0.5 0.5 0.5" visible="false" 
animation="property: position; from: 0 0.1 0; to: 0 0.2 0; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true;">
</a-gltf-model>
<!-- Dynamic models 5-10 added for when files are uploaded -->
<a-gltf-model id="ar-model-5" src="#model5" position="0 0.1 0" scale="0.5 0.5 0.5" visible="false" 
animation="property: position; from: 0 0.1 0; to: 0 0.2 0; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true;">
</a-gltf-model>
<a-gltf-model id="ar-model-6" src="#model6" position="0 0.1 0" scale="0.5 0.5 0.5" visible="false" 
animation="property: position; from: 0 0.1 0; to: 0 0.2 0; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true;">
</a-gltf-model>
<a-gltf-model id="ar-model-7" src="#model7" position="0 0.1 0" scale="0.5 0.5 0.5" visible="false" 
animation="property: position; from: 0 0.1 0; to: 0 0.2 0; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true;">
</a-gltf-model>
<a-gltf-model id="ar-model-8" src="#model8" position="0 0.1 0" scale="0.5 0.5 0.5" visible="false" 
animation="property: position; from: 0 0.1 0; to: 0 0.2 0; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true;">
</a-gltf-model>
<a-gltf-model id="ar-model-9" src="#model9" position="0 0.1 0" scale="0.5 0.5 0.5" visible="false" 
animation="property: position; from: 0 0.1 0; to: 0 0.2 0; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true;">
</a-gltf-model>
<a-gltf-model id="ar-model-10" src="#model10" position="0 0.1 0" scale="0.5 0.5 0.5" visible="false" 
animation="property: position; from: 0 0.1 0; to: 0 0.2 0; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true;">
</a-gltf-model>
</a-marker>

<a-entity camera></a-entity>
</a-scene>

<script type="module" src="/src/main.js"></script>
</body>
</html>
